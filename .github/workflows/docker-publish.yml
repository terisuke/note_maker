name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build linux/amd64 and linux/arm64 without pushing to GHCR"
        required: false
        default: "0"
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Verify release metadata
        shell: bash
        run: |
          test -n "${{ steps.meta.outputs.tags }}"
          test -n "${{ steps.meta.outputs.labels }}"
          echo "${{ steps.meta.outputs.tags }}" | grep -E '^${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'
          echo "platforms=linux/amd64,linux/arm64"

      - name: Build multi-arch dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and publish
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Render Compose config
        run: |
          docker compose config >/tmp/note-maker-compose.yml
          docker compose --profile tailscale config >/tmp/note-maker-compose-tailscale.yml
